apiVersion: v1
kind: Service
metadata:
  name: plugport-server
spec:
  selector:
    app: plugport-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: mongodb
      port: 27017
      targetPort: 27017
    - name: postgresql
      port: 5432
      targetPort: 5432
    - name: mysql
      port: 3306
      targetPort: 3306
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP
