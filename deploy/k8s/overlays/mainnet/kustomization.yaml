apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: mainnet-

patches:
  - target:
      kind: ConfigMap
      name: plugport-config
    patch: |
      - op: add
        path: /data/NODE_ENV
        value: "production"
      - op: add
        path: /data/IS_TESTNET
        value: "false"
      - op: replace
        path: /data/LOG_LEVEL
        value: "warn"

  - target:
      kind: Ingress
      name: plugport-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "api.plugport.xyz"

  - target:
      kind: Deployment
      name: plugport-server
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"

  - target:
      kind: HorizontalPodAutoscaler
      name: plugport-server-hpa
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 20
