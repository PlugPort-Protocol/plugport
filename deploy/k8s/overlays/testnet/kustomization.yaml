apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namePrefix: testnet-

patches:
  - target:
      kind: ConfigMap
      name: plugport-config
    patch: |
      - op: add
        path: /data/NODE_ENV
        value: "production"
      - op: add
        path: /data/IS_TESTNET
        value: "true"
      - op: add
        path: /data/MONAD_CHAIN_ID
        value: "10143"
      - op: replace
        path: /data/LOG_LEVEL
        value: "info"

  - target:
      kind: Ingress
      name: plugport-ingress
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: "testnet-api.plugport.xyz"

  - target:
      kind: Deployment
      name: plugport-server
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
