# PlugPort Docker Compose — Base Services
# Usage:
#   Dev (auto-loads override):  docker compose up
#   Testnet:                    docker compose -f docker-compose.yml -f docker-compose.testnet.yml --env-file ../../.env.testnet up
#   Mainnet:                    docker compose -f docker-compose.yml -f docker-compose.mainnet.yml --env-file ../../.env.mainnet up

services:
  # ---- Core Server ----
  plugport-server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: plugport-server
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${WIRE_PORT:-27017}:27017"
      - "${REDIS_PORT:-6379}:6379"
      - "${PG_PORT:-5432}:5432"
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      - HTTP_PORT=8080
      - WIRE_PORT=27017
      - REDIS_PORT=6379
      - PG_PORT=5432
      - MYSQL_PORT=3306
      - HOST=0.0.0.0
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - METRICS_ENABLED=true
      - MONGODB_ENABLED=${MONGODB_ENABLED:-true}
      - PG_ENABLED=${PG_ENABLED:-false}
      - MYSQL_ENABLED=${MYSQL_ENABLED:-false}
      - REDIS_ENABLED=${REDIS_ENABLED:-false}
      - API_KEY=${API_KEY:-}
      - SQL_STATEMENT_TIMEOUT_MS=${SQL_STATEMENT_TIMEOUT_MS:-30000}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - plugport-net
    labels:
      - "com.plugport.service=server"

  # ---- Dashboard ----
  plugport-dashboard:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dashboard
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://plugport-server:8080}
        - NEXT_PUBLIC_CHAIN_ID=${NEXT_PUBLIC_CHAIN_ID:-10143}
    container_name: plugport-dashboard
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://plugport-server:8080}
    depends_on:
      plugport-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - plugport-net

  # ---- Prometheus ----
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: plugport-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - plugport-server
    restart: unless-stopped
    networks:
      - plugport-net

  # ---- Grafana ----
  grafana:
    image: grafana/grafana:11.3.0
    container_name: plugport-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-plugport}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - plugport-net

networks:
  plugport-net:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
