# Where PlugPort alerts are delivered: a Telegram bot.
#
# TELEGRAM_BOT_TOKEN (from @BotFather) is passed to the Grafana container from
# the environment (see docker-compose.yml) and never committed. Grafana expands
# ${VAR} in provisioning files.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: plugport-telegram
        type: telegram
        settings:
          bottoken: ${TELEGRAM_BOT_TOKEN}
          # The "Plugport" channel. Written literally, not ${TELEGRAM_CHAT_ID}:
          # Grafana re-parses a substituted value, so -100… became a number (even
          # quoted) and provisioning failed, which stops Grafana from starting.
          # Not a secret — posting needs the bot token.
          chatid: "-1003597818341"
          # Human-readable format from templates.yml.
          message: '{{ template "plugport.telegram" . }}'
          parse_mode: HTML
          disable_web_page_preview: true
        disableResolveMessage: false
