# PlugPort alert rules (Grafana-managed, evaluated every minute).
#
# Each rule runs one PromQL query (refId A) and compares it with a threshold
# (refId C). Background: in September 2026 the server crashed on an RPC rate
# limit and on a heap OOM, and the Store gas wallet ran dry so every write
# failed for two days — all found by hand, days later.
#
# Annotations avoid `$` template variables: Grafana expands $VAR in
# provisioning files as environment variables. `index .Labels "x"` is used instead.
apiVersion: 1

groups:
  - orgId: 1
    name: plugport
    folder: PlugPort
    interval: 1m
    rules:
      - uid: plugport-server-down
        title: Server down
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'The PlugPort server isn''t answering, so the API, dashboard and database ports are all down.'
          description: 'It has been unreachable for over a minute. On the VPS, check docker ps and then docker logs plugport-server.'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: plugport-prometheus
            model: { refId: A, expr: 'up{job="plugport-server"}', instant: true }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      - uid: plugport-server-restarted
        title: Server restarted
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: info }
        annotations:
          summary: 'The PlugPort server restarted.'
          description: 'Expected right after a deploy. If nobody deployed, it crashed and Docker restarted it: check docker logs plugport-server.'
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: plugport-prometheus
            model: { refId: A, expr: 'changes(process_start_time_seconds{job="plugport-server"}[10m])', instant: true }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      - uid: plugport-heap-high
        title: Server memory high
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'The server has used over 80% of its memory limit for 2 minutes.'
          description: 'At 100% it crashes. Check the PlugPort Overview dashboard in Grafana to see which traffic grew.'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: plugport-prometheus
            model: { refId: A, expr: 'nodejs_heap_size_used_bytes{job="plugport-server"} / plugport_heap_limit_bytes{job="plugport-server"}', instant: true }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0.8] } }]

      - uid: plugport-wallet-low
        title: Gas wallet low
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'The {{ index .Labels "role" }} gas wallet has less than 1 MON left.'
          description: 'Send testnet MON to {{ index .Labels "address" }}. When it runs out, its transactions fail (for the store wallet, that means every document write).'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: plugport-prometheus
            model: { refId: A, expr: 'plugport_wallet_balance_mon{job="plugport-server"}', instant: true }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: lt, params: [1] } }]

      - uid: plugport-wallet-balances-missing
        title: Gas wallet balances missing
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'The server has stopped reporting gas wallet balances.'
          description: 'Until this is fixed, the "Gas wallet low" alert cannot fire. Look for [Balances] warnings in docker logs plugport-server.'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: plugport-prometheus
            model: { refId: A, expr: 'absent(plugport_wallet_balance_mon{job="plugport-server"})', instant: true }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]

      - uid: plugport-chain-writes-failing
        title: On-chain writes failing
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: 'Server transactions are failing: more than 2 in the last 15 minutes, at the {{ index .Labels "stage" }} step.'
          description: 'send usually means a wallet is out of MON or the RPC is refusing transactions. confirm means they revert or never confirm. Check docker logs plugport-server.'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: plugport-prometheus
            model: { refId: A, expr: 'sum by (stage) (increase(plugport_chain_tx_failures_total{job="plugport-server"}[15m]))', instant: true }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [2] } }]

      - uid: plugport-rpc-unstable
        title: RPC unstable
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: 'Monad''s public RPC keeps failing: the server switched to the Alchemy backup more than 10 times in 15 minutes.'
          description: 'Requests still work, but on the backup''s smaller budget. Usually temporary. If it lasts for hours, lower RPC_MAX_REQUESTS_PER_SECOND.'
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: plugport-prometheus
            model: { refId: A, expr: 'increase(plugport_rpc_failovers_total{job="plugport-server"}[15m])', instant: true }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [10] } }]
