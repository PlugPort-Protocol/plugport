# PlugPort Docker Compose — Monad Testnet
# Usage: docker compose -f docker-compose.yml -f docker-compose.testnet.yml --env-file ../../.env.testnet up
#
# Requires .env.testnet with:
#   MONAD_RPC_URL, MONAD_PRIVATE_KEY, MONAD_CONTRACT_ADDRESS, DASHBOARD_URL

services:
  plugport-server:
    environment:
      - NODE_ENV=production
      - IS_TESTNET=true
      - LOG_LEVEL=info
      # ---- Monad Testnet ----
      - MONAD_RPC_URL=${MONAD_RPC_URL}
      - MONAD_CHAIN_ID=10143
      # Legacy single key: still honoured as the fallback for every role below,
      # so an existing deployment keeps working unchanged. Prefer the per-role
      # keys — one key holding every role means one compromise takes all of it.
      - MONAD_PRIVATE_KEY=${MONAD_PRIVATE_KEY:-}
      # ---- Per-role wallets (each falls back to MONAD_PRIVATE_KEY if unset) ----
      - STORE_PRIVATE_KEY=${STORE_PRIVATE_KEY:-}
      - PRIVATE_STORE_PRIVATE_KEY=${PRIVATE_STORE_PRIVATE_KEY:-}
      - MESSAGEBROKER_PRIVATE_KEY=${MESSAGEBROKER_PRIVATE_KEY:-}
      # ---- Secrets that are NOT wallets (no on-chain authority) ----
      # ENCRYPTION_KEY: root of the AES key for private collections. Changing it
      # makes existing encrypted data unreadable — set it to whatever key the
      # data was originally encrypted under (the legacy MONAD_PRIVATE_KEY).
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      # SESSION_SECRET: seeds the session-cookie secret. Changing it logs users out.
      - SESSION_SECRET=${SESSION_SECRET:-}
      - MONAD_CONTRACT_ADDRESS=${MONAD_CONTRACT_ADDRESS}
      # ---- CORS ----
      - DASHBOARD_URL=${DASHBOARD_URL}
      # ---- Public hostname shown in wire-protocol connection strings ----
      # Deliberately NOT API_DOMAIN: that domain is Cloudflare-proxied, and
      # Cloudflare's standard proxy only forwards HTTP(S) on 80/443 — a real
      # mongodb://, postgresql://, mysql:// or redis:// client pointed at it
      # would silently hang forever. WIRE_PROTOCOL_HOSTNAME must be a
      # DNS-only ("grey cloud") record pointing directly at this VPS's IP.
      - PUBLIC_HOSTNAME=${WIRE_PROTOCOL_HOSTNAME}
      # ---- Optional: Private Store & PubSub ----
      - PRIVATE_STORE_CONTRACT=${PRIVATE_STORE_CONTRACT:-}
      - MESSAGEBROKER_CONTRACT_ADDRESS=${MESSAGEBROKER_CONTRACT_ADDRESS:-}
      - MESSAGEBROKER_GAS_STATION=${MESSAGEBROKER_GAS_STATION:-}
      - MONAD_WS_URL=${MONAD_WS_URL:-}
      - RELATIONAL_CONTRACT_ADDRESS=${RELATIONAL_CONTRACT_ADDRESS:-}
      # ---- Optional: On-Chain Auth ----
      - AUTH_CONTRACT_ADDRESS=${AUTH_CONTRACT_ADDRESS:-}
      - AUTH_GAS_STATION_PRIVATE_KEYS=${AUTH_GAS_STATION_PRIVATE_KEYS:-}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  plugport-dashboard:
    environment:
      - NODE_ENV=production
